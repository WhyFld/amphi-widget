<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>amphi — widget preview</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e8e8e8; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); z-index:1; }
  .brand { font-weight:800; letter-spacing:-.02em; font-size:20px; }
  nav a { color:var(--muted); text-decoration:none; font-size:14px; margin-left:22px; }
  .wrap { max-width:1040px; margin:0 auto; padding:48px 28px 120px; }
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  .shot { aspect-ratio:4/5; border-radius:18px; background:linear-gradient(135deg,#f0f0f0,#dcdcdc); display:flex; align-items:center; justify-content:center; color:#bdbdbd; font-size:14px; }
  h1 { font-size:40px; line-height:1.05; letter-spacing:-.03em; margin:0 0 14px; }
  .price { font-size:20px; font-weight:700; margin:0 0 18px; }
  p.lead { color:var(--muted); line-height:1.6; margin:0 0 26px; }
  .buy { background:var(--ink); color:#fff; border:none; border-radius:12px; padding:14px 26px; font-size:16px; font-weight:700; cursor:pointer; }
  .note { margin-top:72px; padding:16px 18px; border:1px dashed var(--line); border-radius:12px; background:#fafafa; color:var(--muted); font-size:13px; line-height:1.65; }
  .note b { color:var(--ink); }
  .pill { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.06em; padding:3px 9px; border-radius:999px; vertical-align:middle; }
  .pill.live { background:#e7f7ec; color:#137a3a; }
  .pill.staging { background:#fdf0dd; color:#9a5b00; }
  code { background:#eee; padding:2px 6px; border-radius:4px; font-size:12px; word-break:break-all; }
  @media (max-width:760px){ .hero{ grid-template-columns:1fr; gap:28px; } h1{ font-size:32px; } nav{ display:none; } }
</style>
</head>
<body>
  <header>
    <div class="brand">ACME&nbsp;STUDIO</div>
    <nav><a href="#">Shop</a><a href="#">About</a><a href="#">Journal</a><a href="#">Cart (0)</a></nav>
  </header>

  <div class="wrap">
    <div class="hero">
      <div class="shot">product image</div>
      <div>
        <h1>The Everyday Tee</h1>
        <div class="price">$38.00</div>
        <p class="lead">A fake storefront for testing the amphi widget on a real page. The floating coin in the corner is the widget for the brand in the URL — tap it to open the response flow exactly as a shopper would.</p>
        <button class="buy">Add to cart</button>
      </div>
    </div>

    <div class="note" id="note"></div>
  </div>

  <!-- Loads /embed.js RELATIVE to this page, so this same file reflects whichever
       deployment serves it: the production widget on widget.getamphi.com, or the
       staging widget on the staging Vercel URL. Brand comes from ?brand_id=.
       The coin is forced to show (AMPHI_FORCE_SHOW) unless you pass &force=0. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var brand = (q.get('brand_id') || q.get('brand') || '').trim();
      var force = q.get('force') !== '0';
      var isStaging = /staging|vercel\.app/i.test(location.hostname);
      var env = isStaging ? 'staging' : 'live';
      var note = document.getElementById('note');
      var safeBrand = brand.replace(/[^a-zA-Z0-9-]/g, '');

      if (!safeBrand) {
        note.innerHTML = '<b>No brand set.</b> Add <code>?brand_id=YOUR_BRAND_ID</code> to the URL to load a store’s widget.';
        return;
      }

      note.innerHTML =
        '<b>amphi widget preview</b> <span class="pill ' + env + '">' + env.toUpperCase() + '</span><br>' +
        'Brand: <code>' + safeBrand + '</code><br>' +
        'Serving the <b>' + env + '</b> <code>embed.js</code> (relative to this page). ' +
        'Coin ' + (force ? 'forced to show' : 'shows only with a live campaign') + '. ' +
        'The response form appears when this brand has an active campaign.';

      if (force) window.AMPHI_FORCE_SHOW = true;
      var s = document.createElement('script');
      s.src = '/embed.js?brand_id=' + encodeURIComponent(safeBrand);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
