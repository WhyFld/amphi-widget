<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>VERSO — Silver Jewellery</title>
<!-- preview.html: the widget preview page, dressed as a made-up lifestyle store for recording
     content. The store look rotates (this week: VERSO, a made-up silver jewellery brand); the loading
     never changes: /embed.js relative to this page, brand from ?brand_id=, coin forced on (&force=0). noindex. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  /* Layout: one 100vh view. Scrolling ticker, centred wordmark header, category nav, then a 4-up grid:
     two silver pieces on pale tiles, one dark editorial tile, one more piece. Monochrome, silver only. */
  :root {
    --ink: #0B0B0B;
    --muted: #6E6E6E;
    --paper: #FFFFFF;
    --tile: #F3F3F1;
    --line: #E6E6E3;
    --silver: #C9CCD1;
    --silver-hi: #F4F5F7;
    --silver-lo: #8A8F98;
    --gold: #C9A246;
    --sans: 'Jost', 'Futura', 'Helvetica Neue', Arial, sans-serif;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--paper); overflow: hidden; display: flex; flex-direction: column; }

  .ticker { background: var(--ink); color: #fff; overflow: hidden; white-space: nowrap; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 10px 0; }
  .ticker .track { display: inline-block; animation: tick 40s linear infinite; }
  .ticker span { margin: 0 22px; }
  .ticker span::after { content: "·"; margin-left: 44px; }
  @keyframes tick { to { transform: translateX(-50%); } }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 28px 8px; }
  .burger { width: 26px; display: grid; gap: 6px; }
  .burger i { display: block; height: 1.5px; background: var(--ink); }
  .logo { font-weight: 600; font-size: 34px; letter-spacing: .32em; padding-left: .32em; line-height: 1; }
  .tools { display: flex; justify-content: flex-end; align-items: center; gap: 22px; font-size: 14px; }
  .tools svg { width: 22px; height: 22px; }
  nav.cats { display: flex; justify-content: center; gap: 30px; padding: 14px 16px 16px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  nav.cats a { color: var(--ink); text-decoration: none; }
  nav.cats a.on { text-decoration: underline; text-underline-offset: 6px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .card { display: flex; flex-direction: column; min-height: 0; padding: 0 0 18px; }
  .art { position: relative; flex: 1; min-height: 0; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
  .card + .card .art { border-left: 1px solid #fff; }
  .art svg { width: 70%; height: 70%; }
  .meta { padding: 14px 18px 0; }
  .name { font-size: 14px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .price { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .swatch { display: flex; gap: 8px; margin-top: 10px; }
  .swatch i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .swatch i.on { outline: 1px solid var(--ink); outline-offset: 2px; }
  .badge { position: absolute; left: 14px; top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; background: #fff; padding: 6px 9px; }

  /* the editorial tile */
  .art.dark { background: radial-gradient(90% 70% at 50% 35%, #2A2A2A, #0B0B0B 70%); color: #fff; }
  .art.dark svg { width: 62%; height: 62%; }
  .ed { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; }
  .ed .k { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .7; }
  .ed .h { font-family: var(--serif); font-weight: 300; font-size: clamp(30px, 3vw, 46px); line-height: 1; margin-top: 8px; font-style: italic; }
  .ed .cta { display: inline-block; margin-top: 14px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.6); padding-bottom: 3px; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    nav.cats { gap: 18px; overflow: hidden; font-size: 12px; justify-content: flex-start; white-space: nowrap; }
    .art.dark svg { width: 46%; height: 46%; margin-top: -30%; }
    .ed { bottom: 16px; } .ed .k { display: none; } .ed .h { font-size: 28px; }
    .logo { font-size: 26px; }
    .tools .cur { display: none; }
    .meta { padding: 8px 10px 0; } .swatch { display: none; } .name { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; } }
</style>
</head>
<body>
  <div class="ticker"><div class="track" id="track"></div></div>
  <header>
    <div class="burger" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="logo">VERSO</div>
    <div class="tools">
      <span class="cur">GBP £</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="Search"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="Bag"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
    </div>
  </header>
  <nav class="cats"><a href="#">Gift guide</a><a href="#" class="on">New in</a><a href="#">Best sellers</a><a href="#">Necklaces</a><a href="#">Rings</a><a href="#">Bracelets</a><a href="#">Chains</a><a href="#">Shop all</a></nav>

  <main id="grid"></main>

  <script>
    // ticker: the usual store promises, doubled so the loop is seamless
    const PROMISES = ['Free UK delivery on £150+ orders', 'Recycled 925 sterling silver', 'Lifetime polishing', 'Free returns within 30 days', 'Sign up for 10% off your first order'];
    document.getElementById('track').innerHTML = [...PROMISES, ...PROMISES].map(p => `<span>${p}</span>`).join('');

    // silver pieces, drawn: a gradient gives them a polished-metal look
    const DEFS = `<defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F5F7"/><stop offset=".45" stop-color="#B9BDC4"/><stop offset=".6" stop-color="#EEF0F3"/><stop offset="1" stop-color="#8A8F98"/></linearGradient></defs>`;
    const chain = (x1, y1, x2, y2, n, r) => { let s = ''; for (let i = 0; i <= n; i++) { const t = i / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t + Math.sin(t * Math.PI) * 0; s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r}" ry="${(r * .6).toFixed(1)}" transform="rotate(${(Math.atan2(y2 - y1, x2 - x1) * 57.3 + (i % 2 ? 90 : 0)).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="none" stroke="url(#ag)" stroke-width="1.6"/>`; } return s; };
    const PENDANT = `<svg viewBox="0 0 200 260" aria-hidden="true">${DEFS}${chain(52, 10, 96, 170, 26, 4)}${chain(148, 10, 104, 170, 26, 4)}<circle cx="100" cy="196" r="34" fill="url(#ag)"/><circle cx="100" cy="196" r="27" fill="none" stroke="#9AA0A8" stroke-width="1.2"/><path d="M100 181l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#8A8F98"/><circle cx="100" cy="160" r="5" fill="none" stroke="url(#ag)" stroke-width="2.5"/></svg>`;
    const SIGNET = `<svg viewBox="0 0 200 200" aria-hidden="true">${DEFS}<ellipse cx="100" cy="118" rx="66" ry="52" fill="none" stroke="url(#ag)" stroke-width="16"/><ellipse cx="100" cy="76" rx="40" ry="26" fill="url(#ag)"/><ellipse cx="100" cy="76" rx="40" ry="26" fill="none" stroke="#9AA0A8" stroke-width="1.2"/><path d="M100 64l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#1E5B45"/></svg>`;
    const TENNIS = `<svg viewBox="8 26 224 86" aria-hidden="true">${DEFS}${Array.from({ length: 22 }, (_, i) => { const a = Math.PI * (1.05 + i / 21 * .9), x = 120 + Math.cos(a) * 100, y = 100 + Math.sin(a) * 60; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="url(#ag)" stroke="#9AA0A8" stroke-width=".8"/><circle cx="${(x - 1.6).toFixed(1)}" cy="${(y - 1.6).toFixed(1)}" r="1.8" fill="#fff"/>`; }).join('')}</svg>`;
    const STACK = `<svg viewBox="0 0 200 240" aria-hidden="true">${DEFS}${chain(40, 0, 96, 130, 30, 3.5)}${chain(160, 0, 104, 130, 30, 3.5)}${chain(30, 0, 94, 200, 44, 3)}${chain(170, 0, 106, 200, 44, 3)}<circle cx="100" cy="140" r="9" fill="url(#ag)"/></svg>`;
    const CARDS = [
      { name: 'Coin pendant necklace', price: '£175', art: PENDANT, badge: 'Best seller', sw: ['#C9CCD1', '#D9B867'] },
      { name: 'Signet ring, malachite', price: '£155', art: SIGNET, badge: 'New', sw: ['#C9CCD1', '#D9B867', '#2F2F2F'] },
      { dark: true },
      { name: 'Tennis bracelet', price: '£140', art: TENNIS, sw: ['#C9CCD1'] }
    ];
    document.getElementById('grid').innerHTML = CARDS.map(c => c.dark
      ? `<div class="card"><div class="art dark">${STACK}<div class="ed"><div class="k">The chain edit</div><div class="h">Stack season.</div><span class="cta">Shop chains</span></div></div><div class="meta"><div class="name">Layered chains</div><div class="price">From £95</div><div class="swatch"><i class="on" style="background:#C9CCD1"></i><i style="background:#D9B867"></i></div></div></div>`
      : `<div class="card"><div class="art">${c.badge ? `<span class="badge">${c.badge}</span>` : ''}${c.art}</div><div class="meta"><div class="name">${c.name}</div><div class="price">${c.price}</div><div class="swatch">${c.sw.map((s, i) => `<i class="${i ? '' : 'on'}" style="background:${s}"></i>`).join('')}</div></div></div>`).join('');
  </script>

  <!-- The amphi widget: /embed.js relative to this site (live or staging), brand from ?brand_id=, coin forced on unless &force=0. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var brand = (q.get('brand_id') || q.get('brand') || '').replace(/[^a-zA-Z0-9-]/g, '');
      if (!brand) return;
      if (q.get('force') !== '0') window.AMPHI_FORCE_SHOW = true;
      // Open the popup from THIS deployment's widget.html, not production. Without
      // this, embed.js defaults WIDGET_URL to widget.getamphi.com/widget.html, so
      // the staging preview would load the *production* popup and never reflect
      // staging widget.html changes (the exact trap that hid the mobile-size fix).
      window.AMPHI_WIDGET_URL = location.origin + '/widget.html';
      var s = document.createElement('script');
      s.src = '/embed.js?brand_id=' + encodeURIComponent(brand);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
