<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, display-capture=*">
  <title>AMPHI Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .glass-popup {
      background: rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.15),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }

    .glass-popup h2,
    .glass-popup p {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .campaign-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .popup-enter {
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInFromLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .slide-right {
      animation: slideInFromRight 0.3s ease-out;
    }

    .slide-left {
      animation: slideInFromLeft 0.3s ease-out;
    }

    .carousel-dot {
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .carousel-dot.active {
      background: #CCFF66;
      width: 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(204, 255, 102, 0.5);
    }

    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 30;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.05);
    }

    .arrow-btn.left {
      left: 8px;
    }

    .arrow-btn.right {
      right: 8px;
    }

    .poll-option {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }
    .poll-option:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(204, 255, 102, 0.5);
    }
    .poll-option.selected {
      background: rgba(204, 255, 102, 0.2);
      border-color: #CCFF66;
    }

    textarea, input[type="text"], input[type="email"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
    }
    textarea:focus, input:focus {
      border-color: #CCFF66;
      background: rgba(255, 255, 255, 0.15);
    }
    textarea::placeholder, input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .loading {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

/* Fixed widget height - responsive */
.amphi-widget-container {
  height: 600px;
  max-height: 90vh; /* Don't exceed 90% of screen on mobile */
}

/* Smooth scrolling */
#content {
  scrollbar-width: thin;
  scrollbar-color: rgba(204, 255, 102, 0.3) transparent;
}

#content::-webkit-scrollbar {
  width: 6px;
}

#content::-webkit-scrollbar-track {
  background: transparent;
}

#content::-webkit-scrollbar-thumb {
  background: rgba(204, 255, 102, 0.3);
  border-radius: 3px;
}

#content::-webkit-scrollbar-thumb:hover {
  background: rgba(204, 255, 102, 0.5);
}

/* Mobile adjustments */
@media (max-width: 640px) {
  .amphi-widget-container {
    height: auto;
    min-height: 500px;
    max-height: 85vh; /* More room for mobile keyboard */
  }
  
  #content {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

.loading-dots::after {
  content: '...';
  display: inline-block;
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}

    font-style: normal;
  }

  * {
    font-family: 'Unica77', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
  }
    
  </style>

<script>
// ============================================
// SUPABASE CONNECTION
// ============================================
const SUPABASE_URL = 'https://puhsbgrublugmqqgvmqd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1aHNiZ3J1Ymx1Z21xcWd2bXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAwMTE5MjQsImV4cCI6MjA3NTU4NzkyNH0.tFzNj4RMmgxa2hm_nf0IR1dvedy2u3GST2LmjLeV6WE';
// ✅ NEW: Read brand ID from URL parameter
const urlParams = new URLSearchParams(window.location.search);
const BRAND_ID = urlParams.get('brand') || '3c4b9a71-3aa4-4a9d-b17c-5bedf24b50c2'; // Fallback

// Create Supabase client for storage uploads
const supabaseClient = {
  storage: {
    from: (bucket) => ({
      upload: async (path, file, options) => {
        const formData = new FormData();
        formData.append('file', file);
        
        const response = await fetch(
          `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`,
          {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: file
          }
        );
        
        if (!response.ok) {
          const error = await response.json();
          return { data: null, error };
        }
        
        return { data: { path }, error: null };
      },
      getPublicUrl: (path) => ({
        publicUrl: `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`
      })
    })
  }
};

// Track completed campaigns in localStorage
function getCompletedCampaigns() {
  const completed = localStorage.getItem('amphi_completed_campaigns');
  return completed ? JSON.parse(completed) : [];
}

function markCampaignCompleted(campaignId) {
  const completed = getCompletedCampaigns();
  if (!completed.includes(campaignId)) {
    completed.push(campaignId);
    localStorage.setItem('amphi_completed_campaigns', JSON.stringify(completed));
  }
}

function isCampaignCompleted(campaignId) {
  return getCompletedCampaigns().includes(campaignId);
}

function getIconForType(type) {
  const icons = {
    'poll': '📊',
    'text_feedback': '💬',
    'video_upload': '🎥',
    'audio_upload': '🎤',
    'image_upload': '📸'
  };
  return icons[type] || '📋';
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="text-center">
      <div class="text-4xl mb-4">⚠️</div>
      <p class="text-white/70">${message}</p>
    </div>
  `;
}

// ============================================
// NAVIGATION
// ============================================
function goBack() {
  if (currentStep === 2) {
    currentStep = 1;
    currentQuestionIndex = 0;
    formData = {};
    renderStep1();
  } else if (currentStep === 3) {
    currentStep = 2;
    currentQuestionIndex = 0;
    renderStep2();
  } else if (currentStep === 4) {
    currentStep = 3;
    renderStep3();
  }
}

function closeWidget() {
  minimizeWidget();
}


function startCampaign() {
  currentStep = 2;
  currentQuestionIndex = 0;
  formData = {};
  renderStep2();
}

// ============================================
// STEP 1: CAMPAIGN CAROUSEL
// ============================================
function renderStep1() {
  document.getElementById('backBtn').classList.add('hidden');
  
  const campaign = campaigns[0];
  
  let taskDetails = '';
  if (campaign.type === 'poll') {
    taskDetails = `${campaign.questions.length} quick questions`;
  } else if (campaign.type === 'text_feedback') {
    taskDetails = `${campaign.questions.length} text questions`;
  } else if (campaign.type === 'video_upload') {
    taskDetails = 'Record 90-second video';
  } else if (campaign.type === 'audio_upload') {
    taskDetails = 'Record 60-second audio';
  } else if (campaign.type === 'image_upload') {
    taskDetails = 'Upload 1 photo';
  }

  document.getElementById('content').innerHTML = `
    <div class="text-center mb-6">
      <p class="text-white/90 text-2xl font-bold">We want to hear from you</p>
    </div>

    <div class="campaign-area rounded-2xl p-8 mb-6 min-h-[280px] flex items-center justify-center">
      <div class="text-center">
<div class="mb-4 flex justify-center items-center" style="min-height: 64px;">${campaign.icon}</div>
      <p class="text-white/80 text-lg font-semibold mb-2">${
        campaign.type === 'poll' ? 'Poll' : 
        campaign.type === 'text_feedback' ? 'Survey' : 
        campaign.type === 'video_upload' ? 'Record a short video' : 
        campaign.type === 'audio_upload' ? 'Share a voice note' : 'Upload a photo'
        }</p>
        <p class="text-white/50 text-sm">Takes ${
          campaign.type === 'poll' ? '30 seconds' : 
          campaign.type === 'text_feedback' ? '2 minutes' : 
          campaign.type === 'video_upload' ? '3 minutes' : 
          campaign.type === 'audio_upload' ? '2 minutes' : '1 minute'
        }</p>
      </div>
    </div>

 <button onclick="startCampaign()" class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg">
     Start →
   </button>
  `;
}

// ============================================
// STEP 2: CAMPAIGN FORM
// ============================================
function renderStep2() {
  document.getElementById('backBtn').classList.remove('hidden');
  
 const campaign = campaigns[0];

  if (campaign.type === 'poll') {
    renderPoll(campaign);
  } else if (campaign.type === 'text_feedback') {
    renderTextFeedback(campaign);
  } else if (campaign.type === 'video_upload') {
    renderVideoUpload(campaign);
  } else if (campaign.type === 'audio_upload') {
    renderAudioUpload(campaign);
  } else if (campaign.type === 'image_upload') {
    renderImageUpload(campaign);
  }
}

// POLL
function renderPoll(campaign) {
  const question = campaign.questions[currentQuestionIndex];
  const totalQuestions = campaign.questions.length;
  const isLastQuestion = currentQuestionIndex === totalQuestions - 1;

  document.getElementById('content').innerHTML = `
    <div class="text-center mb-4">
      <div class="text-white/50 text-sm mb-2">Question ${currentQuestionIndex + 1} of ${totalQuestions}</div>
      <h3 class="text-white text-xl font-bold">${question.question}</h3>
    </div>

    <div class="space-y-3 mb-6">
      ${question.options.map((option, i) => `
        <button onclick="selectPollOption(${i})" 
                id="poll-option-${i}"
                class="poll-option w-full py-4 px-6 rounded-xl text-white font-medium text-left">
          ${option}
        </button>
      `).join('')}
    </div>

    <button id="nextBtn" onclick="${isLastQuestion ? 'submitPoll()' : 'nextPollQuestion()'}" 
            class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg opacity-50 cursor-not-allowed" 
            disabled>
      ${isLastQuestion ? 'Submit →' : 'Next Question →'}
    </button>
  `;
}

function selectPollOption(index) {
  document.querySelectorAll('.poll-option').forEach(btn => {
    btn.classList.remove('selected');
  });
  
  document.getElementById(`poll-option-${index}`).classList.add('selected');
  
  const campaign = campaigns[0];
  const question = campaign.questions[currentQuestionIndex];
  formData[`question_${currentQuestionIndex}`] = {
    question: question.question,
    answer: question.options[index]
  };
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
}

function nextPollQuestion() {
  currentQuestionIndex++;
  renderStep2();
}

async function submitPoll() {
  console.log('📊 Submitting poll:', formData);
  
  const campaign = campaigns[0];
  
  // Build readable text content from poll answers
  let textContent = '';
  Object.values(formData).forEach((item, index) => {
    textContent += `Q${index + 1}: ${item.question}\nA: ${item.answer}\n\n`;
  });
  
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        task_id: campaign.id,
        brand_id: BRAND_ID,
        submission_type: 'poll',
        text_content: textContent.trim(),
        survey_responses: formData,
        status: 'pending',
        customer_email: 'test@example.com'
      })
    });

    if (response.ok) {
  const data = await response.json();
  formData.submissionId = data[0].id;  // ← NEW: Remember the ID
  console.log('✅ [Type] submitted successfully!');
  renderStep3();
} else {
      const error = await response.json();
      console.error('❌ Submission failed:', error);
      alert('Submission failed. Please try again.');

// Audio recording variables
let mediaRecorder;
let audioChunks = [];
let recordingTimer;
let recordingSeconds = 0;
let audioBlob;
  

async function startAudioRecording() {
  try {
    // Request microphone permission
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    recordingSeconds = 0;
    
    // Show timer
    document.getElementById('timer').classList.remove('hidden');
    document.getElementById('recordBtn').textContent = '⏹️ Stop Recording';
    document.getElementById('recordBtn').onclick = stopAudioRecording;
    document.getElementById('recordBtn').classList.remove('bg-[#CCFF66]');
    document.getElementById('recordBtn').classList.add('bg-red-500', 'hover:bg-red-600');
    
    // Collect audio data
    mediaRecorder.ondataavailable = (event) => {
      audioChunks.push(event.data);
    };
    
    // When recording stops
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      showAudioPreview();
      
      // Stop all tracks
      stream.getTracks().forEach(track => track.stop());
    };
    
    // Start recording
    mediaRecorder.start();
    
    // Start timer
    recordingTimer = setInterval(() => {
      recordingSeconds++;
      const minutes = Math.floor(recordingSeconds / 60);
      const seconds = recordingSeconds % 60;
      document.getElementById('timer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
      
      // Auto-stop at 60 seconds
      if (recordingSeconds >= 60) {
        stopAudioRecording();
      }
    }, 1000);
    
  } catch (error) {
    console.error('Microphone access denied:', error);
    alert('Please allow microphone access to record audio.');
  }
}

function stopAudioRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    clearInterval(recordingTimer);
  }
}

function showAudioPreview() {
  const audioURL = URL.createObjectURL(audioBlob);
  
  // Update the recording area to show preview
  document.getElementById('recordingArea').innerHTML = `
    <div class="w-full">

async function submitAudio() {
  const campaign = campaigns[0];
  
  // Show uploading state
  document.getElementById('audioActions').innerHTML = `
  <div class="text-center text-white/70 py-4">
    <p class="loading-dots">Uploading</p>
  </div>
`;
  
  try {
    // Convert WebM blob to MP3
    const arrayBuffer = await audioBlob.arrayBuffer();
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    
    // Get audio data
    const channelData = audioBuffer.getChannelData(0);
    const samples = new Int16Array(channelData.length);
    for (let i = 0; i < channelData.length; i++) {
      samples[i] = Math.max(-1, Math.min(1, channelData[i])) * 0x7FFF;
    }
    
    // Encode to MP3
    const mp3encoder = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128);
    const mp3Data = [];
    const sampleBlockSize = 1152;
    
    for (let i = 0; i < samples.length; i += sampleBlockSize) {
      const sampleChunk = samples.subarray(i, i + sampleBlockSize);
      const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }
    }
    
    const mp3buf = mp3encoder.flush();
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
    
    // Create MP3 blob
    const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
    
    // Upload MP3 to Supabase Storage
    const fileName = `audio_${Date.now()}_${Math.random().toString(36).substr(2, 9)}.mp3`;
    
    const uploadResponse = await fetch(
      `${SUPABASE_URL}/storage/v1/object/campaign-audio/${fileName}`,
      {

        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'audio/mp3'
        },
        body: mp3Blob
      }
    );
    
    if (!uploadResponse.ok) throw new Error('Upload failed');
    
    // Get public URL
    const audioUrl = `${SUPABASE_URL}/storage/v1/object/public/campaign-audio/${fileName}`;
    console.log('✅ MP3 uploaded:', audioUrl);
    
    // Save submission to database
    const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        task_id: campaign.id,
        brand_id: BRAND_ID,
        submission_type: 'audio_upload',
        audio_url: audioUrl,
        status: 'pending',
        customer_email: 'test@example.com'

    });

    if (response.ok) {

  renderStep3();
} else {

  } catch (error) {

   <div class="text-center mb-6 mt-12">
  <h3 class="text-white text-2xl font-bold mb-2">Thanks for sharing!</h3>
  <p class="text-white/70 text-sm mb-6">Enter your email so the team can get in touch</p>
</div>

    <div class="campaign-area rounded-2xl p-6 mb-6">
      <input type="email" 
             id="emailInput"
             placeholder="your@email.com" 
             class="w-full p-3 rounded-xl mb-4">
      <div id="errorMsg" class="text-red-400 text-sm mb-2 hidden"></div>
    </div>

    <button id="submitBtn" onclick="handleFreeSubmission()" 
            class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg">
      Submit →
    </button>
  `;
}

async function handleFreeSubmission() {
  const email = document.getElementById('emailInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  
  if (!email || !email.includes('@')) {
    errorMsg.textContent = 'Please enter a valid email address';
    errorMsg.classList.remove('hidden');
    return;
  }
  
  errorMsg.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  
  try {
    const campaign = campaigns[0];
    
    // Check for duplicate email
    const duplicateCheck = await fetch(
      SUPABASE_URL + '/rest/v1/submissions?task_id=eq.' + campaign.id + '&customer_email=eq.' + encodeURIComponent(email) + '&select=id,status',
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      }
    );
    
    const existingSubmissions = await duplicateCheck.json();
    
    if (existingSubmissions && existingSubmissions.length > 0) {
      console.log('Duplicate email detected:', email);
      
      // Delete orphaned submission
      if (formData.submissionId) {
        await fetch(SUPABASE_URL + '/rest/v1/submissions?id=eq.' + formData.submissionId, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });
      }
      
      document.getElementById('content').innerHTML = '<div class="text-center"><div class="text-6xl mb-6">⚠️</div><h3 class="text-white text-2xl font-bold mb-4">You already completed this!</h3><p class="text-white/70 text-sm mb-6">' + email + ' has already submitted a response to this campaign.</p></div>';
      
      setTimeout(function() {
        markCampaignCompleted(campaign.id);
        handleFinalClose();
      }, 3000);
      
      return;
    }
    
    // Update submission with real email and auto-approve
    await fetch(SUPABASE_URL + '/rest/v1/submissions?id=eq.' + formData.submissionId, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ 
        customer_email: email,
        status: 'approved'
      })
    });
    
// CHECK IF LIMIT REACHED - AUTO-DEACTIVATE CAMPAIGN
    const deactivateResponse = await fetch(
      SUPABASE_URL + '/rest/v1/rpc/auto_deactivate_if_limit_reached',
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ campaign_uuid: campaign.id })
      }
    );
    
    const limitReached = await deactivateResponse.json();
    
    if (limitReached) {
      console.log('🔴 Limit reached - campaign deactivated');
    }
    
    
    // Mark campaign completed for this user
    markCampaignCompleted(campaign.id);
  
    // Show success
    document.getElementById('content').innerHTML = `
      <div class="flex items-center justify-center h-full">
        <div class="text-center">
          <h2 class="text-white text-3xl font-bold">All done!</h2>
        </div>
      </div>
    `;
    
    setTimeout(function() {
      handleFinalClose();
    }, 3000);
    
  } catch (error) {
    console.error('Error:', error);
    errorMsg.textContent = 'Something went wrong. Please try again.';
    errorMsg.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Submit →';
  }
}

  
function minimizeWidget() {
  // Send message to parent to minimize
  window.parent.postMessage({ action: 'minimize' }, '*');
}
  
function showFinalSuccess() {
  document.getElementById('backBtn').classList.add('hidden');
  
  document.getElementById('content').innerHTML = `
    <div class="text-center">
      <div class="text-6xl mb-6">🤑</div>
      <h2 class="text-white text-3xl font-bold mb-4">Niceone!</h2>
      <p class="text-white/80 text-lg mb-4">
        Your submission has been received and your bank account is linked.
      </p>
      <div class="bg-[#CCFF66]/10 border border-[#CCFF66]/30 rounded-xl p-6 mb-6">
        <p class="text-[#CCFF66] font-semibold mb-2">What happens next?</p>
        <p class="text-white/70 text-sm">
          The brand will review your submission. Once approved, you'll receive your payment within 24-48 hours.
        </p>
      </div>
      <button onclick="handleFinalClose()" 
        class="w-full py-3 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all">
      Close
    </button>
    </div>
  `;
}

function handleFinalClose() {
  const campaign = campaigns[0];
  
  // Tell parent to hide icon permanently
  window.parent.postMessage({
    action: 'hide_icon_forever',
    brandId: BRAND_ID,
    campaignId: campaign.id
  }, '*');
  
  console.log('✅ Campaign completed, hiding icon permanently');
}

loadCampaigns();
</script>
