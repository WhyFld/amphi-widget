<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMPHI Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .glass-popup {
      background: rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.15),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }

    .glass-popup h2,
    .glass-popup p {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .campaign-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .popup-enter {
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInFromLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .slide-right {
      animation: slideInFromRight 0.3s ease-out;
    }

    .slide-left {
      animation: slideInFromLeft 0.3s ease-out;
    }

    .carousel-dot {
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .carousel-dot.active {
      background: #CCFF66;
      width: 24px;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(204, 255, 102, 0.5);
    }

    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 30;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.05);
    }

    .arrow-btn.left {
      left: 8px;
    }

    .arrow-btn.right {
      right: 8px;
    }

    .poll-option {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }
    .poll-option:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(204, 255, 102, 0.5);
    }
    .poll-option.selected {
      background: rgba(204, 255, 102, 0.2);
      border-color: #CCFF66;
    }

    textarea, input[type="text"], input[type="email"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
    }
    textarea:focus, input:focus {
      border-color: #CCFF66;
      background: rgba(255, 255, 255, 0.15);
    }
    textarea::placeholder, input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .loading {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

/* Fixed widget height - responsive */
.amphi-widget-container {
  height: 600px;
  max-height: 90vh; /* Don't exceed 90% of screen on mobile */
}

/* Smooth scrolling */
#content {
  scrollbar-width: thin;
  scrollbar-color: rgba(204, 255, 102, 0.3) transparent;
}

#content::-webkit-scrollbar {
  width: 6px;
}

#content::-webkit-scrollbar-track {
  background: transparent;
}

#content::-webkit-scrollbar-thumb {
  background: rgba(204, 255, 102, 0.3);
  border-radius: 3px;
}

#content::-webkit-scrollbar-thumb:hover {
  background: rgba(204, 255, 102, 0.5);
}

/* Mobile adjustments */
@media (max-width: 640px) {
  .amphi-widget-container {
    height: auto;
    min-height: 500px;
    max-height: 85vh; /* More room for mobile keyboard */
  }
  
  #content {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

.loading-dots::after {
  content: '...';
  display: inline-block;
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}

    
  </style>
</head>
<body>

<div id="widget-root" class="w-full h-screen flex items-center justify-center p-4">
  <div class="glass-popup popup-enter rounded-3xl w-full max-w-lg relative flex flex-col amphi-widget-container">
    
    <!-- HEADER: Fixed buttons (60px) -->
    <div class="relative flex-shrink-0" style="height: 60px;">
      <button onclick="minimizeWidget()" class="absolute top-4 right-4 text-white/60 hover:text-white text-2xl font-bold w-8 h-8 flex items-center justify-center transition-all hover:scale-110 z-50">
        ×
      </button>
      <button id="backBtn" onclick="goBack()" class="absolute top-4 left-4 text-white/60 hover:text-white text-xl font-bold z-10 transition-colors hidden">
        ← Back
      </button>
    </div>

    <!-- CONTENT: Scrollable area -->
    <div id="content" class="flex-1 overflow-y-auto px-8 pb-8">
  <div class="text-center py-20">
    <p class="text-white/70 loading-dots">Loading campaigns</p>
  </div>
</div>

    <!-- FOOTER: Powered by (40px) -->
    <div class="text-center py-3 text-white/30 text-xs flex-shrink-0 border-t border-white/5">
      Powered by SUPAFANS
    </div>

  </div>
</div>

<div id="minimizedIcon" class="hidden fixed bottom-6 right-6 z-50 cursor-pointer group" onclick="restoreWidget()">
  <div class="relative">
    <!-- Icon Circle -->
    <div class="w-16 h-16 rounded-full bg-[#CCFF66] flex items-center justify-center shadow-2xl transform transition-all duration-300 group-hover:scale-110">
      <span class="text-3xl">💬</span>
    </div>
    <!-- Pulse Animation -->
    <div class="absolute inset-0 rounded-full bg-[#CCFF66] opacity-20 animate-ping"></div>
  </div>
</div>
  
<script>
// ============================================
// SUPABASE CONNECTION
// ============================================
const SUPABASE_URL = 'https://puhsbgrublugmqqgvmqd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1aHNiZ3J1Ymx1Z21xcWd2bXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAwMTE5MjQsImV4cCI6MjA3NTU4NzkyNH0.tFzNj4RMmgxa2hm_nf0IR1dvedy2u3GST2LmjLeV6WE';
// ✅ NEW: Read brand ID from URL parameter
const urlParams = new URLSearchParams(window.location.search);
const BRAND_ID = urlParams.get('brand') || '3c4b9a71-3aa4-4a9d-b17c-5bedf24b50c2'; // Fallback

// Create Supabase client for storage uploads
const supabaseClient = {
  storage: {
    from: (bucket) => ({
      upload: async (path, file, options) => {
        const formData = new FormData();
        formData.append('file', file);
        
        const response = await fetch(
          `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`,
          {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: file
          }
        );
        
        if (!response.ok) {
          const error = await response.json();
          return { data: null, error };
        }
        
        return { data: { path }, error: null };
      },
      getPublicUrl: (path) => ({
        publicUrl: `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`
      })
    })
  }
};

// Track completed campaigns in localStorage
function getCompletedCampaigns() {
  const completed = localStorage.getItem('amphi_completed_campaigns');
  return completed ? JSON.parse(completed) : [];
}

function markCampaignCompleted(campaignId) {
  const completed = getCompletedCampaigns();
  if (!completed.includes(campaignId)) {
    completed.push(campaignId);
    localStorage.setItem('amphi_completed_campaigns', JSON.stringify(completed));
  }
}

function isCampaignCompleted(campaignId) {
  return getCompletedCampaigns().includes(campaignId);
}


  
// ============================================
// STATE MANAGEMENT
// ============================================
let currentStep = 1;
let currentQuestionIndex = 0;
let formData = {};
let campaigns = [];

// ============================================
// FETCH CAMPAIGNS FROM SUPABASE
// ============================================
async function loadCampaigns() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/tasks?brand_id=eq.${BRAND_ID}&is_active=eq.true&select=*`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );

   const data = await response.json();

  // If no active campaigns, hide widget completely
  if (!data || data.length === 0) {
    console.log('ℹ️ No active campaigns - hiding widget');
    document.getElementById('widget-root').style.display = 'none';
    return;
  }

    // Just take the first one
    const campaign = data[0];

    campaigns = [{
      id: campaign.id,
      title: campaign.title,
      description: campaign.description,
      type: campaign.task_type,
      reward: campaign.reward_amount,
      questions: campaign.required_fields || [],
      icon: campaign.task_type === 'poll' ? '📊' :
            campaign.task_type === 'text_feedback' ? '💬' :
            campaign.task_type === 'video_upload' ? '🎥' :
            campaign.task_type === 'audio_upload' ? '🎤' :
            campaign.task_type === 'image_upload' ? '📸' : '📄'
    }];

    console.log('Loaded single campaign:', campaigns[0]);

    // STRIPE RETURN: SHOW SUCCESS EVEN IF COMPLETED
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success') === 'true') {
      const email = urlParams.get('email');
      console.log('Returning from Stripe — showing success');

      await fetch(`${SUPABASE_URL}/rest/v1/customers?email=eq.${encodeURIComponent(email)}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          stripe_onboarding_completed: true
        })
      });

      showFinalSuccess();
      window.history.replaceState({}, '', window.location.pathname);
      return;
    }

    // NORMAL FLOW: Hide if already completed
 
if (isCampaignCompleted(campaigns[0].id)) {
  console.log('User already completed — hiding widget');
  
  // Tell parent to hide icon permanently
  window.parent.postMessage({
    action: 'hide_icon_forever',
    brandId: BRAND_ID,
    campaignId: campaigns[0].id
  }, '*');
  
  return;
}

    renderStep1();

  } catch (error) {
    console.error('❌ Failed to load campaigns:', error);
    showError('Failed to load campaigns');
  }
}

function getIconForType(type) {
  const icons = {
    'poll': '📊',
    'text_feedback': '💬',
    'video_upload': '🎥',
    'audio_upload': '🎤',
    'image_upload': '📸'
  };
  return icons[type] || '📋';
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="text-center">
      <div class="text-4xl mb-4">⚠️</div>
      <p class="text-white/70">${message}</p>
    </div>
  `;
}

// ============================================
// NAVIGATION
// ============================================
function goBack() {
  if (currentStep === 2) {
    currentStep = 1;
    currentQuestionIndex = 0;
    formData = {};
    renderStep1();
  } else if (currentStep === 3) {
    currentStep = 2;
    currentQuestionIndex = 0;
    renderStep2();
  } else if (currentStep === 4) {
    currentStep = 3;
    renderStep3();
  }
}

function closeWidget() {
  minimizeWidget();
}


function startCampaign() {
  currentStep = 2;
  currentQuestionIndex = 0;
  formData = {};
  renderStep2();
}

// ============================================
// STEP 1: CAMPAIGN CAROUSEL
// ============================================
function renderStep1() {
  document.getElementById('backBtn').classList.add('hidden');
  
  const campaign = campaigns[0];
  
  let taskDetails = '';
  if (campaign.type === 'poll') {
    taskDetails = `${campaign.questions.length} quick questions`;
  } else if (campaign.type === 'text_feedback') {
    taskDetails = `${campaign.questions.length} text questions`;
  } else if (campaign.type === 'video_upload') {
    taskDetails = 'Record 90-second video';
  } else if (campaign.type === 'audio_upload') {
    taskDetails = 'Record 60-second audio';
  } else if (campaign.type === 'image_upload') {
    taskDetails = 'Upload 1 photo';
  }

  document.getElementById('content').innerHTML = `
    <div class="text-center mb-6">
      <p class="text-white/90 text-2xl font-bold">Tell us what you think</p>
    </div>

    <div class="campaign-area rounded-2xl p-8 mb-6 min-h-[280px] flex items-center justify-center">
      <div class="text-center">
        <div class="text-6xl mb-4">${campaign.icon}</div>
      <p class="text-white/80 text-lg font-semibold mb-2">${
        campaign.type === 'poll' ? 'Poll' : 
        campaign.type === 'text_feedback' ? 'Survey' : 
        campaign.type === 'video_upload' ? 'Record a short video' : 
        campaign.type === 'audio_upload' ? 'Share a voice note' : 'Upload a photo'
        }</p>
        <p class="text-white/50 text-sm">Takes ${
          campaign.type === 'poll' ? '30 seconds' : 
          campaign.type === 'text_feedback' ? '2 minutes' : 
          campaign.type === 'video_upload' ? '3 minutes' : 
          campaign.type === 'audio_upload' ? '2 minutes' : '1 minute'
        }</p>
      </div>
    </div>

 <button onclick="startCampaign()" class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg">
     Start →
   </button>
  `;
}

// ============================================
// STEP 2: CAMPAIGN FORM
// ============================================
function renderStep2() {
  document.getElementById('backBtn').classList.remove('hidden');
  
 const campaign = campaigns[0];

  if (campaign.type === 'poll') {
    renderPoll(campaign);
  } else if (campaign.type === 'text_feedback') {
    renderTextFeedback(campaign);
  } else if (campaign.type === 'video_upload') {
    renderVideoUpload(campaign);
  } else if (campaign.type === 'audio_upload') {
    renderAudioUpload(campaign);
  } else if (campaign.type === 'image_upload') {
    renderImageUpload(campaign);
  }
}

// POLL
function renderPoll(campaign) {
  const question = campaign.questions[currentQuestionIndex];
  const totalQuestions = campaign.questions.length;
  const isLastQuestion = currentQuestionIndex === totalQuestions - 1;

  document.getElementById('content').innerHTML = `
    <div class="text-center mb-4">
      <div class="text-white/50 text-sm mb-2">Question ${currentQuestionIndex + 1} of ${totalQuestions}</div>
      <h3 class="text-white text-xl font-bold">${question.question}</h3>
    </div>

    <div class="space-y-3 mb-6">
      ${question.options.map((option, i) => `
        <button onclick="selectPollOption(${i})" 
                id="poll-option-${i}"
                class="poll-option w-full py-4 px-6 rounded-xl text-white font-medium text-left">
          ${option}
        </button>
      `).join('')}
    </div>

    <button id="nextBtn" onclick="${isLastQuestion ? 'submitPoll()' : 'nextPollQuestion()'}" 
            class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg opacity-50 cursor-not-allowed" 
            disabled>
      ${isLastQuestion ? 'Submit →' : 'Next Question →'}
    </button>
  `;
}

function selectPollOption(index) {
  document.querySelectorAll('.poll-option').forEach(btn => {
    btn.classList.remove('selected');
  });
  
  document.getElementById(`poll-option-${index}`).classList.add('selected');
  
  const campaign = campaigns[0];
  const question = campaign.questions[currentQuestionIndex];
  formData[`question_${currentQuestionIndex}`] = {
    question: question.question,
    answer: question.options[index]
  };
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
}

function nextPollQuestion() {
  currentQuestionIndex++;
  renderStep2();
}

async function submitPoll() {
  console.log('📊 Submitting poll:', formData);
  
  const campaign = campaigns[0];
  
  // Build readable text content from poll answers
  let textContent = '';
  Object.values(formData).forEach((item, index) => {
    textContent += `Q${index + 1}: ${item.question}\nA: ${item.answer}\n\n`;
  });
  
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        task_id: campaign.id,
        brand_id: BRAND_ID,
        submission_type: 'poll',
        text_content: textContent.trim(),
        survey_responses: formData,
        status: 'pending',
        customer_email: 'test@example.com'
      })
    });

    if (response.ok) {
  const data = await response.json();
  formData.submissionId = data[0].id;  // ← NEW: Remember the ID
  console.log('✅ [Type] submitted successfully!');
  renderStep3();
} else {
      const error = await response.json();
      console.error('❌ Submission failed:', error);
      alert('Submission failed. Please try again.');
    }
  } catch (error) {
    console.error('❌ Submission error:', error);
    alert('Submission failed. Please try again.');
  }
}
// TEXT FEEDBACK
function renderTextFeedback(campaign) {
  const question = campaign.questions[currentQuestionIndex];
  const totalQuestions = campaign.questions.length;
  const isLastQuestion = currentQuestionIndex === totalQuestions - 1;

  document.getElementById('content').innerHTML = `
    <div class="text-center mb-4">
      <div class="text-white/50 text-sm mb-2">Question ${currentQuestionIndex + 1} of ${totalQuestions}</div>
      <h3 class="text-white text-xl font-bold mb-6">${question.question || question}</h3>
    </div>

    <textarea id="textInput" 
              onkeyup="checkTextInput()"
              placeholder="Type your answer here..." 
              rows="6" 
              maxlength="500"
              class="w-full p-4 rounded-xl mb-2 resize-none"></textarea>
    
    <div class="text-white/40 text-xs text-right mb-6">
      <span id="charCount">0</span>/500 characters
    </div>

    <button id="nextBtn" onclick="${isLastQuestion ? 'submitText()' : 'nextTextQuestion()'}" 
            class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg opacity-50 cursor-not-allowed" 
            disabled>
      ${isLastQuestion ? 'Submit →' : 'Next Question →'}
    </button>
  `;
}

function checkTextInput() {
  const input = document.getElementById('textInput');
  const count = input.value.length;
  document.getElementById('charCount').textContent = count;
  
  const campaign = campaigns[0];
  const question = campaign.questions[currentQuestionIndex];
  
  const nextBtn = document.getElementById('nextBtn');
  if (count > 10) {
    formData[`question_${currentQuestionIndex}`] = {
    question: question.question || question,
    answer: input.value
  };
    nextBtn.disabled = false;
    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
  } else {
    nextBtn.disabled = true;
    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
  }
}

function nextTextQuestion() {
  currentQuestionIndex++;
  renderStep2();
}

async function submitText() {
  console.log('💬 Submitting text feedback:', formData);
  
  const campaign = campaigns[0];
  
  // Build readable text content from all answers
  let textContent = '';
  Object.values(formData).forEach((item, index) => {
    textContent += `Q${index + 1}: ${item.question}\nA: ${item.answer}\n\n`;
  });
  
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        task_id: campaign.id,
        brand_id: BRAND_ID,
        submission_type: 'text_feedback',
        text_content: textContent.trim(),
        survey_responses: formData,
        status: 'pending',
        customer_email: 'test@example.com'
      })
    });

    if (response.ok) {
  const data = await response.json();
  formData.submissionId = data[0].id;  // ← NEW: Remember the ID
  console.log('✅ [Type] submitted successfully!');
  renderStep3();
} else {
      const error = await response.json();
      console.error('❌ Submission failed:', error);
      alert('Submission failed. Please try again.');
    }
  } catch (error) {
    console.error('❌ Submission error:', error);
    alert('Submission failed. Please try again.');
  }
}

  
// VIDEO/AUDIO/IMAGE 
  
function renderVideoUpload(campaign) {
  document.getElementById('content').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-[400px]">
      <div class="text-center mb-8">
        <div class="text-white/50 text-sm mb-2">What we'd like from you</div>
        <h3 class="text-white text-xl font-bold">${campaign.description}</h3>
      </div>

      <div id="videoArea" class="w-full mb-6">
        <video id="videoPreview" class="hidden w-full rounded-lg" autoplay muted playsinline></video>
        <video id="videoPlayback" class="hidden w-full rounded-lg" controls playsinline></video>
        <div id="videoTimer" class="hidden text-white text-3xl font-mono text-center mt-4">0:00</div>
      </div>

      <div class="w-full">
        <button id="videoRecordBtn" onclick="startVideoRecording()" 
                class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg">
          🎥 Start Recording
        </button>
        
        <div id="videoActions" class="hidden space-y-3 mt-3">
          <button onclick="retakeVideo()" 
                  class="w-full py-3 bg-gray-800 text-white rounded-xl hover:bg-gray-700 transition font-semibold">
            🔄 Retake
          </button>
         <button onclick="submitVideo()" 
        class="w-full py-4 bg-[#CCFF66] hover:bg-[#b8e659] text-black font-bold rounded-xl transition-all text-lg">
  'Submit →'
</button>
        </div>
      </div>
    </div>
  `;
}

// Audio recording variables
let mediaRecorder;
let audioChunks = [];
let recordingTimer;
let recordingSeconds = 0;
let audioBlob;
  

async function startAudioRecording() {
  try {
    // Request microphone permission
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    recordingSeconds = 0;
    
    // Show timer
    document.getElementById('timer').classList.remove('hidden');
    document.getElementById('recordBtn').textContent = '⏹️ Stop Recording';
    document.getElementById('recordBtn').onclick = stopAudioRecording;
    document.getElementById('recordBtn').classList.remove('bg-[#CCFF66]');
    document.getElementById('recordBtn').classList.add('bg-red-500', 'hover:bg-red-600');
    
    // Collect audio data
    mediaRecorder.ondataavailable = (event) => {
      audioChunks.push(event.data);
    };
    
    // When recording stops
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      showAudioPreview();
      
      // Stop all tracks
      stream.getTracks().forEach(track => track.stop());
    };
    
    // Start recording
    mediaRecorder.start();
    
    // Start timer
    recordingTimer = setInterval(() => {
      recordingSeconds++;
      const minutes = Math.floor(recordingSeconds / 60);
      const seconds = recordingSeconds % 60;
      document.getElementById('timer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
      
      // Auto-stop at 60 seconds
      if (recordingSeconds >= 60) {
        stopAudioRecording();
      }
    }, 1000);
    
  } catch (error) {
    console.error('Microphone access denied:', error);
    alert('Please allow microphone access to record audio.');
  }
}

function stopAudioRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    clearInterval(recordingTimer);
  }
}

function showAudioPreview() {
  const audioURL = URL.createObjectURL(audioBlob);
  
  // Update the recording area to show preview
  document.getElementById('recordingArea').innerHTML = `
    <div class="w-full">
      <div class="bg-black/30 rounded-xl p-6">
        <audio controls class="w-full" src="${audioURL}" style="height: 54px;"></audio>
      </div>
    </div>
  `;
  
  // Hide record button, show actions
  document.getElementById('recordBtn').classList.add('hidden');
  document.getElementById('audioActions').classList.remove('hidden');
}

function retakeAudio() {
  // Reset UI
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('audioPreview').classList.add('hidden');
  document.getElementById('audioActions').classList.add('hidden');
  
  document.getElementById('recordBtn').classList.remove('hidden', 'bg-red-500', 'hover:bg-red-600');
  document.getElementById('recordBtn').classList.add('bg-[#CCFF66]', 'hover:bg-[#b8e659]');
  document.getElementById('recordBtn').textContent = '🎤 Start Recording';
  document.getElementById('recordBtn').onclick = startAudioRecording;
  
  // Clear data
  audioChunks = [];
  audioBlob = null;
  recordingSeconds = 0;
}

async function submitAudio() {
  const campaign = campaigns[0];
  
  // Show uploading state
  document.getElementById('audioActions').innerHTML = `
  <div class="text-center text-white/70 py-4">
    <p class="loading-dots">Uploading</p>
  </div>
`;
  
  try {
    // Convert WebM blob to MP3
    const arrayBuffer = await audioBlob.arrayBuffer();
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    
    // Get audio data
    const channelData = audioBuffer.getChannelData(0);
    const samples = new Int16Array(channelData.length);
    for (let i = 0; i < channelData.length; i++) {
      samples[i] = Math.max(-1, Math.min(1, channelData[i])) * 0x7FFF;
    }
    
    // Encode to MP3
    const mp3encoder = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128);
    const mp3Data = [];
    const sampleBlockSize = 1152;
    
    for (let i = 0; i < samples.length; i += sampleBlockSize) {
      const sampleChunk = samples.subarray(i, i + sampleBlockSize);
      const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }
    }
    
    const mp3buf = mp3encoder.flush();
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
    
    // Create MP3 blob
    const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
    
    // Upload MP3 to Supabase Storage
    const fileName = `audio_${Date.now()}_${Math.random().toString(36).substr(2, 9)}.mp3`;
    
    const uploadResponse = await fetch(
      `${SUPABASE_URL}/storage/v1/object/campaign-audio/${fileName}`,
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'audio/mp3'
        },
        body: mp3Blob
      }
    );
    
    if (!uploadResponse.ok) throw new Error('Upload failed');
    
    // Get public URL
    const audioUrl = `${SUPABASE_URL}/storage/v1/object/public/campaign-audio/${fileName}`;
    console.log('✅ MP3 uploaded:', audioUrl);
    
    // Save submission to database
    const response = await fetch(`${SUPABASE_URL}/rest/v1/submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        task_id: campaign.id,
        brand_id: BRAND_ID,
        submission_type: 'audio_upload',
        audio_url: audioUrl,
        status: 'pending',
        customer_email: 'test@example.com'
      })
    });

    if (response.ok) {
  const data = await response.json();
  formData.submissionId = data[0].id;  // ← NEW: Remember the ID
  console.log('✅ [Type] submitted successfully!');
  renderStep3();
} else {
      throw new Error('Failed to save submission');
    }
    
  } catch (error) {
    console.error('❌ Upload failed:', error);
    alert('Upload failed. Please try again.');
    retakeAudio();
  }
}

// Video recording variables
let videoStream;
let videoRecorder;
let videoChunks = [];
let videoTimer;
let videoSeconds = 0;
let videoBlob;

async function startVideoRecording() {
  try {
    // Request camera and microphone
    videoStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user' },
      audio: true 
    });
    
    // Show camera preview
const preview = document.getElementById('videoPreview');
preview.srcObject = videoStream;
preview.classList.remove('hidden');

    
    // Initialize recorder
    videoRecorder = new MediaRecorder(videoStream, {
      mimeType: 'video/webm;codecs=vp8,opus'
    });
    videoChunks = [];
    videoSeconds = 0;
    
    // Update button
    const btn = document.getElementById('videoRecordBtn');
    btn.textContent = '⏹️ Stop Recording';
    btn.onclick = stopVideoRecording;
    btn.classList.remove('bg-[#CCFF66]', 'hover:bg-[#b8e659]');
    btn.classList.add('bg-red-500', 'hover:bg-red-600');
    
    // Show timer
    document.getElementById('videoTimer').classList.remove('hidden');
    
    // Collect video data
    videoRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        videoChunks.push(event.data);
      }
    };
    
    // When recording stops
    videoRecorder.onstop = () => {
      videoBlob = new Blob(videoChunks, { type: 'video/webm' });
      showVideoPlayback();
      
      // Stop camera
      videoStream.getTracks().forEach(track => track.stop());
    };
    
    // Start recording
    videoRecorder.start();
    
    // Start timer
    videoTimer = setInterval(() => {
      videoSeconds++;
      const minutes = Math.floor(videoSeconds / 60);
      const seconds = videoSeconds % 60;
      document.getElementById('videoTimer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
      
      // Auto-stop at 90 seconds
      if (videoSeconds >= 90) {
        stopVideoRecording();
      }
    }, 1000);
    
  } catch (error) {
    console.error('Camera access denied:', error);
    alert('Please allow camera and microphone access to record video.');
  }
}

function stopVideoRecording() {
  if (videoRecorder && videoRecorder.state !== 'inactive') {
    videoRecorder.stop();
    clearInterval(videoTimer);
  }
}

function showVideoPlayback() {
  const videoURL = URL.createObjectURL(videoBlob);

async function handleFreeSubmission() {
  const email = document.getElementById('emailInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');

  if (!email || !email.includes('@')) {
    errorMsg.textContent = 'Please enter a valid email address';
    errorMsg.classList.remove('hidden');
    return;
  }

  errorMsg.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const campaign = campaigns[0];
    
    // Check for duplicate email
    const duplicateCheck = await fetch(
      SUPABASE_URL + '/rest/v1/submissions?task_id=eq.' + campaign.id + '&customer_email=eq.' + encodeURIComponent(email) + '&select=id,status',
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      }
    );

    const existingSubmissions = await duplicateCheck.json();

    if (existingSubmissions && existingSubmissions.length > 0) {
      console.log('Duplicate email detected:', email);
      
      // Delete orphaned submission
      if (formData.submissionId) {
        await fetch(SUPABASE_URL + '/rest/v1/submissions?id=eq.' + formData.submissionId, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });
      }
      
      document.getElementById('content').innerHTML = '<div class="text-center"><div class="text-6xl mb-6">⚠️</div><h3 class="text-white text-2xl font-bold mb-4">You already completed this!</h3><p class="text-white/70 text-sm mb-6">' + email + ' has already submitted a response to this campaign.</p></div>';
      
      setTimeout(function() {
        markCampaignCompleted(campaign.id);
        handleFinalClose();
      }, 3000);
      
      return;
    }

    // Update submission with real email and auto-approve
    await fetch(SUPABASE_URL + '/rest/v1/submissions?id=eq.' + formData.submissionId, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ 
        customer_email: email,
        status: 'approved'  // Auto-approve free submissions
      })
    });

    // Mark campaign completed
    markCampaignCompleted(campaign.id);

  
    // Show success
document.getElementById('content').innerHTML = `
  <div class="flex items-center justify-center h-full">
    <div class="text-center">
      <div class="text-6xl mb-4">✅</div>
      <h2 class="text-white text-3xl font-bold">All done!</h2>
    </div>
  </div>
`;

    setTimeout(function() {
      handleFinalClose();
    }, 3000);

  } catch (error) {
    console.error('Error:', error);
    errorMsg.textContent = 'Something went wrong. Please try again.';
    errorMsg.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Submit →';
  }
}

    action: 'hide_icon_forever',
    brandId: BRAND_ID,
    campaignId: campaign.id
  }, '*');
  
  console.log('✅ Campaign completed, hiding icon permanently');
}

// INIT: Load campaigns on startup
// ============================================
loadCampaigns();
</script>
